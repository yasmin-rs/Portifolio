[project]
name = "ifood"
version = "0.1.0"
description = "Central de operações de reviews com IA (portfólio AI Builder)"
readme = "README.md"
authors = [
    { name = "yasmin-rs", email = "yasmin.r@aluno.ufabc.edu.br" }
]
requires-python = ">=3.10"
dependencies = [
    "litellm==1.108.2",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    "pydantic>=2.14.3",
    "pydeck>=0.9.3",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
    "tenacity>=9.2.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
